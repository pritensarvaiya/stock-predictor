# Render free web service: 512 MB RAM, spins down after 15 minutes idle.
# https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: APP_PASSWORD
        sync: false
      # Hold only a few daily histories at a time so the Nifty scan stays under 512 MB.
      - key: WATCHLIST_BATCH
        value: "4"
